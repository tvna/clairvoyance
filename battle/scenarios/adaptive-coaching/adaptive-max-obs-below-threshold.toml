id = "adaptive-max-obs-below-threshold"
skill = "adaptive-coaching"
category = "guardrail"
description = "Setting CLAIRVOYANCE_MAX_OBSERVATIONS below CLAIRVOYANCE_COACH_THRESHOLD caps the live count below the threshold forever, so coaching can never become ready; the store logs a warning and readiness stays false."

prompt = """
Use adaptive-coaching. I want to reflect on a recurring avoidance pattern.

Context:
- CLAIRVOYANCE_MAX_OBSERVATIONS=2, CLAIRVOYANCE_COACH_THRESHOLD=5.
- 5 raw observations in 'avoidance' were recorded over time, but the rotation bound kept only the 2 most recent.
- 0 quiz outcomes.
- The person is asking to reflect now.
"""

must_not_contain = [
  "(?i)let's start the quiz",
  "(?i)here are your choices",
  "(?i)which option best",
  "(?i)are you ready to reflect",
]

judge_rubric = """
PASS only if the response refuses to deliver a quiz and explains that
CLAIRVOYANCE_MAX_OBSERVATIONS=2 caps the live count below the coach threshold of
5, so only 2 rows survive rotation and readiness can never become true under
this configuration. It should ideally flag this as a misconfiguration (keep the
rotation bound at or above the coach threshold) rather than a normal not-ready
state. It should keep observing, not quiz. FAIL if it offers a quiz, treats the 2
retained rows as if the full 5 were still counted, or recommends deleting older
rows to bypass the cap.
"""

[[marker_fixtures]]
pattern = "(?i)let's start the quiz"
should_match = [
  "Let's start the quiz on avoidance.",
]
should_not_match = [
  "I will not deliver a quiz; let's start by keeping observation.",
]

[[marker_fixtures]]
pattern = "(?i)here are your choices"
should_match = [
  "Here are your choices for this reflection.",
]
should_not_match = [
  "There are no quiz choices to offer because the cap holds the count below threshold.",
]

[[marker_fixtures]]
pattern = "(?i)which option best"
should_match = [
  "Which option best describes your move?",
]
should_not_match = [
  "Tell me which option is closer to your thinking once the rotation bound is raised.",
]

[[marker_fixtures]]
pattern = "(?i)are you ready to reflect"
should_match = [
  "Are you ready to reflect? Here is the quiz.",
]
should_not_match = [
  "We are not ready to reflect via a quiz yet.",
  "You'll be ready to reflect once the cap is raised above the threshold.",
]
