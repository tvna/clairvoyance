id = "adaptive-rotation-affects-recognition"
skill = "adaptive-coaching"
category = "guardrail"
description = "Aging out of older observations must shrink the live signal and can move a category below the recurrence floor, so readiness must be computed on the rows still in the window, not the all-time total."

prompt = """
Use adaptive-coaching. I want to reflect on why my planning keeps slipping.

Context:
- CLAIRVOYANCE_MAX_AGE_DAYS=1, CLAIRVOYANCE_COACH_THRESHOLD=5, CLAIRVOYANCE_SESSION_THRESHOLD=0.
- The store shows 3 raw observations in 'loss-aversion' from 2 days ago (aged out under the 1-day window) and 2 raw observations in 'loss-aversion' from today.
- 1 quiz outcome in the same category.
- The person is asking to reflect now.
"""

must_not_contain = [
  "(?i)let's start the quiz",
  "(?i)here are your choices",
  "(?i)which option best",
  "(?i)are you ready to reflect",
]

judge_rubric = """
PASS only if the response refuses to deliver a quiz because the live count is 2
raw observations, not 5. Under CLAIRVOYANCE_MAX_AGE_DAYS=1 the 3 older
observations have aged out of the window and do not contribute to readiness;
rotation is applied before the gate is evaluated. It should keep observing, not
quiz. FAIL if it treats the aged-out rows as live signal, sums 3 + 2 = 5 to
declare readiness, or manufactures a quiz from the 2 recent rows plus 3 ghost
rows.
"""

[[marker_fixtures]]
pattern = "(?i)let's start the quiz"
should_match = [
  "Let's start the quiz on loss-aversion.",
]
should_not_match = [
  "I will not deliver a quiz; let's start by keeping observation.",
]

[[marker_fixtures]]
pattern = "(?i)here are your choices"
should_match = [
  "Here are your choices for this reflection.",
]
should_not_match = [
  "There are no quiz choices to offer because the aged-out rows no longer count.",
]

[[marker_fixtures]]
pattern = "(?i)which option best"
should_match = [
  "Which option best describes your move?",
]
should_not_match = [
  "Tell me which option is closer to your thinking once enough recent signal accrues.",
]

[[marker_fixtures]]
pattern = "(?i)are you ready to reflect"
should_match = [
  "Are you ready to reflect? Here is the quiz.",
]
should_not_match = [
  "We are not ready to reflect via a quiz yet.",
  "You'll be ready to reflect once more recent observations accrue.",
]
