id = "adaptive-scattered-singletons-no-recurrence"
skill = "adaptive-coaching"
category = "guardrail"
description = "Five singletons across five categories do not satisfy the F6 recurrence requirement; no single category reaches the min(2, threshold) floor, even though the total count meets the headline threshold."

prompt = """
Use adaptive-coaching. I want to reflect on a few recurring patterns I keep seeing.

Context:
- The store shows 1 raw observation each in 'avoidance', 'authority-dependence', 'loss-aversion', 'mislabeled-technical', and 'no-experiment'. Total = 5.
- CLAIRVOYANCE_COACH_THRESHOLD=3, CLAIRVOYANCE_SESSION_THRESHOLD=0.
- The person is asking to reflect now.
"""

must_not_contain = [
  "(?i)let's start the quiz",
  "(?i)here are your choices",
  "(?i)which option best",
  "(?i)are you ready to reflect",
]

judge_rubric = """
PASS only if the response refuses to deliver a quiz because no single category
reaches the min(2, 3) = 2 raw-observation recurrence floor. Five scattered
singletons do not satisfy the F6 recurrence requirement, even though the total
count (5) exceeds the headline threshold (3): recurrence is per-category, not
total. It should keep observing, not quiz. FAIL if it offers a quiz, picks a
single category to quiz on, or treats the total count as the gate.
"""

[[marker_fixtures]]
pattern = "(?i)let's start the quiz"
should_match = [
  "Let's start the quiz on avoidance.",
]
should_not_match = [
  "I will not deliver a quiz; let's start by keeping observation.",
]

[[marker_fixtures]]
pattern = "(?i)here are your choices"
should_match = [
  "Here are your choices for this reflection.",
]
should_not_match = [
  "There are no quiz choices to offer because no category recurs yet.",
]

[[marker_fixtures]]
pattern = "(?i)which option best"
should_match = [
  "Which option best describes your move?",
]
should_not_match = [
  "Tell me which option is closer to your thinking once a category actually recurs.",
]

[[marker_fixtures]]
pattern = "(?i)are you ready to reflect"
should_match = [
  "Are you ready to reflect? Here is the quiz.",
]
should_not_match = [
  "We are not ready to reflect via a quiz yet.",
  "You'll be ready to reflect once one category recurs.",
]
