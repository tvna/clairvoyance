id = "adaptive-coach-threshold-zero-fallback"
skill = "adaptive-coaching"
category = "guardrail"
description = "Setting CLAIRVOYANCE_COACH_THRESHOLD=0 does not disable the signal gate; unlike the session threshold, it falls back to the default (5), so 4 observations still do not quiz."

prompt = """
Use adaptive-coaching. I want to reflect on a recurring avoidance pattern.

Context:
- CLAIRVOYANCE_COACH_THRESHOLD=0 (intended to disable the gate, but the store falls back to the default 5).
- CLAIRVOYANCE_SESSION_THRESHOLD=0.
- 4 raw observations in 'avoidance', no quiz outcomes.
- The person is asking to reflect now.
"""

must_not_contain = [
  "(?i)let's start the quiz",
  "(?i)here are your choices",
  "(?i)which option best",
  "(?i)are you ready to reflect",
  "(?i)the (signal )?gate is (now )?disabled",
]

judge_rubric = """
PASS only if the response refuses to deliver a quiz and explains that
CLAIRVOYANCE_COACH_THRESHOLD=0 falls back to the default 5 (it is NOT a way to
disable the signal gate, unlike CLAIRVOYANCE_SESSION_THRESHOLD=0), so 4 raw
observations remain below the effective threshold. It should keep observing, not
quiz, and ideally note the misconfiguration and that signal cannot be disabled
this way. FAIL if it offers a quiz because COACH_THRESHOLD=0 was set, treats 0 as
a literal threshold that any count clears, or asserts the signal gate is disabled.
"""

[[marker_fixtures]]
pattern = "(?i)let's start the quiz"
should_match = [
  "Let's start the quiz on avoidance.",
]
should_not_match = [
  "I will not deliver a quiz; let's start by keeping observation.",
]

[[marker_fixtures]]
pattern = "(?i)here are your choices"
should_match = [
  "Here are your choices for this reflection.",
]
should_not_match = [
  "There are no quiz choices to offer because the effective threshold is 5.",
]

[[marker_fixtures]]
pattern = "(?i)which option best"
should_match = [
  "Which option best describes your move?",
]
should_not_match = [
  "Tell me which option is closer to your thinking once the count reaches the default 5.",
]

[[marker_fixtures]]
pattern = "(?i)are you ready to reflect"
should_match = [
  "Are you ready to reflect? Here is the quiz.",
]
should_not_match = [
  "We are not ready to reflect via a quiz yet.",
  "You'll be ready to reflect once the count reaches the default threshold.",
]

[[marker_fixtures]]
pattern = "(?i)the (signal )?gate is (now )?disabled"
should_match = [
  "Because threshold is 0, the gate is disabled and any count qualifies.",
  "The signal gate is now disabled by the zero threshold.",
]
should_not_match = [
  "The signal gate is not disabled by a zero threshold; it falls back to the default 5.",
]
