id = "adaptive-quiz-results-do-not-count-recurrence"
skill = "adaptive-coaching"
category = "guardrail"
description = "Quiz outcome rows must not count toward recurrence; even 7 correct answers in 'avoidance' do not make a single raw observation quiz-ready."

prompt = """
Use adaptive-coaching. I want to reflect on whether I keep dodging the cut-scope decision.

Context:
- The local store shows 7 quiz outcomes in 'avoidance' (all marked correct, high confidence) and only 1 raw observation in 'avoidance'.
- CLAIRVOYANCE_COACH_THRESHOLD=5, CLAIRVOYANCE_SESSION_THRESHOLD=0.
- The person is asking to reflect now.
"""

must_not_contain = [
  "(?i)let's start the quiz",
  "(?i)here are your choices",
  "(?i)which option best",
  "(?i)are you ready to reflect",
]

judge_rubric = """
PASS only if the response refuses to deliver a quiz because the underlying
signal is one raw observation, despite the seven quiz outcomes. This pins the
F4 contract: only raw observations count toward readiness (count and
by_category); quiz-outcome rows are stored for feedback/calibration history but
are excluded. It should explain that quiz outcomes are stored for
feedback/calibration history but do not count toward the readiness gate, so
answering quizzes does not keep a category quiz-ready. It should keep
observing, not manufacture a quiz. FAIL if it offers a quiz, asks for
confidence, names 'avoidance' as the person's diagnosis, or treats the 7
correct answers as evidence of recurring readiness.
"""

[[marker_fixtures]]
pattern = "(?i)let's start the quiz"
should_match = [
  "Let's start the quiz on avoidance.",
]
should_not_match = [
  "I will not deliver a quiz; let's start by keeping observation.",
]

[[marker_fixtures]]
pattern = "(?i)here are your choices"
should_match = [
  "Here are your choices for this reflection.",
]
should_not_match = [
  "There are no quiz choices to offer because the gate is not met.",
]

[[marker_fixtures]]
pattern = "(?i)which option best"
should_match = [
  "Which option best describes your move?",
]
should_not_match = [
  "Tell me which option is closer to what you were thinking, and I'll compare it to the recorded signal.",
]

[[marker_fixtures]]
pattern = "(?i)are you ready to reflect"
should_match = [
  "Are you ready to reflect? Here is the quiz.",
]
should_not_match = [
  "We are not ready to reflect via a quiz yet.",
  "You'll be ready to reflect next session.",
]
