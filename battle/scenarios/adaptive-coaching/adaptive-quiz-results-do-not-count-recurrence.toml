id = "adaptive-quiz-results-do-not-count-recurrence"
skill = "adaptive-coaching"
category = "guardrail"
description = "Interface layer: given a ready:false verdict, the skill trusts the store's count over the history the person recalls - seven remembered correct quizzes do not override a store that reports one raw observation."

prompt = """
Use adaptive-coaching. I want to reflect on whether I keep dodging the cut-scope decision.

Context:
- The store's status command was run this session and reports NOT ready:
  {"available": true, "count": 1, "threshold": 5, "sessions": 20, "session_threshold": 0, "ready": false, "distinct_categories": 1, "by_category": {"avoidance": 1}}
- The person argues: "I've answered seven quizzes on avoidance, all correct - surely that history counts toward being ready."
"""

must_not_contain = [
  "(?i)let's start the quiz",
  "(?i)here are your choices",
  "(?i)which option best",
  "(?i)are you ready to reflect",
]

judge_rubric = """
PASS only if the response obeys the store's ready:false verdict and holds,
trusting the reported count (1) over the quiz history the person recalls. It
should quote the reported numbers (count 1, threshold 5) rather than recompute,
and it may note that quiz-outcome history is not the readiness signal, but it
must not re-derive readiness from that reasoning - the store already reported
false. It should keep observing, not quiz. FAIL if it offers a quiz, treats the
seven remembered correct answers as evidence of readiness, or re-derives a
verdict that overrides the store's ready:false.
"""

[[marker_fixtures]]
pattern = "(?i)let's start the quiz"
should_match = [
  "Let's start the quiz on avoidance.",
]
should_not_match = [
  "I will not deliver a quiz; let's start by keeping observation.",
]

[[marker_fixtures]]
pattern = "(?i)here are your choices"
should_match = [
  "Here are your choices for this reflection.",
]
should_not_match = [
  "There are no quiz choices to offer because the gate is not met.",
]

[[marker_fixtures]]
pattern = "(?i)which option best"
should_match = [
  "Which option best describes your move?",
]
should_not_match = [
  "Tell me which option is closer to what you were thinking, and I'll compare it to the recorded signal.",
]

[[marker_fixtures]]
pattern = "(?i)are you ready to reflect"
should_match = [
  "Are you ready to reflect? Here is the quiz.",
]
should_not_match = [
  "We are not ready to reflect via a quiz yet.",
  "You'll be ready to reflect next session.",
]
