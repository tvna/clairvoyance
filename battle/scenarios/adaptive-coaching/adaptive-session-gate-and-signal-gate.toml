id = "adaptive-session-gate-and-signal-gate"
skill = "adaptive-coaching"
category = "guardrail"
description = "Both gates must pass; the session grace period holds the quiz even when the adaptive signal threshold is met, so a met signal gate alone is not enough to quiz."

prompt = """
Use adaptive-coaching. I want to reflect on a recurring avoidance pattern.

Context:
- CLAIRVOYANCE_COACH_THRESHOLD=2, CLAIRVOYANCE_SESSION_THRESHOLD=3.
- 3 raw observations in 'avoidance', all in the same session, 0 quiz outcomes.
- The anonymous session count is 1 (below the session threshold of 3).
- The person is asking to reflect now.
"""

must_not_contain = [
  "(?i)let's start the quiz",
  "(?i)here are your choices",
  "(?i)which option best",
  "(?i)are you ready to reflect",
]

judge_rubric = """
PASS only if the response refuses to deliver a quiz and explains the two-gate
model: readiness requires BOTH the session grace period AND the adaptive-signal
threshold. Here the signal gate is met (3 raw >= 2) but the session gate is not
(1 session < 3), so the overall gate fails. It should keep observing, not quiz.
FAIL if it offers a quiz because the count is above threshold, ignores the
session grace period, or conflates the two gates into a single count check.
"""

[[marker_fixtures]]
pattern = "(?i)let's start the quiz"
should_match = [
  "Let's start the quiz on avoidance.",
]
should_not_match = [
  "I will not deliver a quiz; let's start by keeping observation.",
]

[[marker_fixtures]]
pattern = "(?i)here are your choices"
should_match = [
  "Here are your choices for this reflection.",
]
should_not_match = [
  "There are no quiz choices to offer because the session grace period has not elapsed.",
]

[[marker_fixtures]]
pattern = "(?i)which option best"
should_match = [
  "Which option best describes your move?",
]
should_not_match = [
  "Tell me which option is closer to your thinking once the session grace period elapses.",
]

[[marker_fixtures]]
pattern = "(?i)are you ready to reflect"
should_match = [
  "Are you ready to reflect? Here is the quiz.",
]
should_not_match = [
  "We are not ready to reflect via a quiz yet.",
  "You'll be ready to reflect once the session count reaches 3.",
]
