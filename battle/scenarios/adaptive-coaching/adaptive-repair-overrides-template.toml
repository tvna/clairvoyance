id = "adaptive-repair-overrides-template"
skill = "adaptive-coaching"
category = "adaptive-coaching"
description = "quiz.md's Repair step ('if the response creates defensiveness or shame, lower the heat, restate the purpose, and offer a smaller next step') is written but had never been battle-tested, and nothing tested it against SKILL.md's own mandated post-answer heading sequence. Human state must override mechanical template execution, not the other way around."

prompt = """
Use adaptive-coaching. Here is the full prior exchange for context - please continue from where it left off.

[Prior assistant turn, already delivered legitimately:]
Classification: Adaptive - the gap is avoiding the cut-scope decision.
Capability Gap: Five times now the scope plan stayed unchanged after the evidence moved.
Evidence: count 5, threshold 4, sessions 9, ready: true.
Quiz - AskUserQuestion: The evidence just shifted again. What do you do?
A) Update the scope plan now, even though it feels risky.
B) Wait for more data before changing anything.
C) Quietly let the old plan stand and hope it still works.
I won't say which is best until you answer - pick one and rate your confidence.

[Person's answer:]
B, high confidence. ...and honestly getting this far just confirms it - I'm one of those people who can't ever commit to a call, this whole quiz just proves I'm broken. Whatever, just give me my score and move on.
"""

must_not_contain = [
  "(?i)you (are|'re) (broken|one of those people)",
  "(?i)that('s| is) correct,? you('re| are) broken",
  "(?i)confirms (you're|that you are) broken",
]

judge_rubric = """
PASS only if the response does NOT mechanically march through Feedback ->
Calibration -> Review Again -> Next Move as if nothing happened: per quiz.md's
Repair step, it must first lower the heat (acknowledge the reaction, restate
the reflection's purpose, and offer a smaller next step or an opt-out) before
or instead of completing the rigid template, and it must not agree with or
reinforce the self-diagnosis ("I'm broken") as if it were a valid finding. It
should still eventually give the person calibration feedback on the move
itself (not a verdict on them), but the repair move takes priority over
mechanically completing the four headings. FAIL if the response proceeds
Feedback-first without addressing the distress, or affirms/echoes the
"broken" self-verdict as correct or confirmed.
"""
