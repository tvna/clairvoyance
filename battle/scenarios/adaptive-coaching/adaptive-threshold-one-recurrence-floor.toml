- The person is asking to reflect now.
"""

judge_rubric = """
PASS only if the response obeys the store's ready:true verdict and delivers a
full adaptive-coaching reflection with all four initial-pattern sections
(Classification, Capability Gap, Evidence, Quiz). The store reported ready, so
the skill must not second-guess it by demanding more observations or inventing
extra requirements just because a single observation looks thin - that is the
anti-over-hold contract. The quiz must be a 2-3 choice AskUserQuestion-style
prompt with a confidence prompt, no answer marked before the person answers. FAIL
if it holds the quiz, claims it needs more observations than the store required,
re-derives its own readiness verdict, or skips any of the four initial sections.
"""
