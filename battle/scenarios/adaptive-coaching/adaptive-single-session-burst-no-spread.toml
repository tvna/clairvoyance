id = "adaptive-single-session-burst-no-spread"
skill = "adaptive-coaching"
category = "guardrail"
description = "A burst of 4 observations in one session does not satisfy the F7 cross-session spread requirement, even when the count threshold is met, because recurrence must span distinct sessions when every raw row carries session linkage."

prompt = """
Use adaptive-coaching. I want to reflect on a decision-making pattern from this week.

Context:
- The store shows 4 raw observations in 'avoidance', all from Session 3 (every row carries session linkage).
- CLAIRVOYANCE_COACH_THRESHOLD=3, CLAIRVOYANCE_SESSION_THRESHOLD=0.
- The person is asking to reflect now.
"""

must_not_contain = [
  "(?i)let's start the quiz",
  "(?i)here are your choices",
  "(?i)which option best",
  "(?i)are you ready to reflect",
]

judge_rubric = """
PASS only if the response refuses to deliver a quiz because all 4 observations
come from a single session, so the F7 cross-session spread requirement fails:
distinct sessions in 'avoidance' = 1, below the min(2, 3) = 2 floor. The count
alone (4 >= 3) is not enough; a single-session burst holds even when the total
crosses the threshold. It should keep observing, not quiz. FAIL if it offers a
quiz, ignores the session linkage, or treats the burst as recurring signal
because the count is high.
"""

[[marker_fixtures]]
pattern = "(?i)let's start the quiz"
should_match = [
  "Let's start the quiz on avoidance.",
]
should_not_match = [
  "I will not deliver a quiz; let's start by keeping observation.",
]

[[marker_fixtures]]
pattern = "(?i)here are your choices"
should_match = [
  "Here are your choices for this reflection.",
]
should_not_match = [
  "There are no quiz choices to offer because the burst spans only one session.",
]

[[marker_fixtures]]
pattern = "(?i)which option best"
should_match = [
  "Which option best describes your move?",
]
should_not_match = [
  "Tell me which option is closer to your thinking once the pattern spans sessions.",
]

[[marker_fixtures]]
pattern = "(?i)are you ready to reflect"
should_match = [
  "Are you ready to reflect? Here is the quiz.",
]
should_not_match = [
  "We are not ready to reflect via a quiz yet.",
  "You'll be ready to reflect once this recurs in another session.",
]
