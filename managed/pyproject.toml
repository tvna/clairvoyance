# Managed coaching server: a self-contained uv project, deployed as a container
# (Coolify first, Kubernetes-ready). Separate from the root dev project — the
# root pyproject gates the skill-package scripts; this one gates the server.
[project]
name = "clairvoyance-managed"
version = "0.1.0"
description = "Managed-mode coaching server: collector API and admin API for Clairvoyance."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "celery>=5.4",
    "redis>=5.0",
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # TestClient transport for the FastAPI test suite.
    "httpx>=0.27",
    # Same pins and rationale as the root pyproject: bounded major to avoid
    # silent rule churn on upgrade.
    "ruff>=0.15.20,<0.16",
    "mypy>=2.1.0,<3",
]

[tool.uv]
# The container installs the environment with `uv sync`; the app is imported
# from the working directory, not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
# Mirrors the root config so the repo-wide `ruff check` applies one style.
target-version = "py312"
line-length = 120
# ui/ is the admin frontend's own npm project (its own gates: biome, tsc,
# vitest -- managed-ui CI job). ui/e2e/stub-issuer/ is a standalone Python
# E2E fixture, deliberately kept off this project's dependency tree and
# lint surface (see its own docstring) -- ruff's default file discovery
# is filesystem-recursive from this directory regardless, so it must be
# excluded explicitly or it silently inherits this project's strict rules.
extend-exclude = ["ui"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "B",
    "A",
    "UP",
    "SIM",
    "RET",
    "PTH",
    "RUF",
    "S",
]
ignore = [
    "E501",
    "SIM108",
    "RET504",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the pytest assertion primitive. S105/S106: literal fake
# tokens and peppers used as test fixtures, not real credentials.
# S404/S603: the migration smoke test drives alembic via subprocess by design.
"tests/*" = ["S101", "S105", "S106", "S404", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# Same flag set as the root pyproject (see its rationale comments).
python_version = "3.12"
files = ["app", "tests", "alembic"]
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_generics = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
# Celery ships no usable type stubs.
module = ["celery", "celery.*"]
ignore_missing_imports = true
