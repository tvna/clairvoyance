# Coolify deployment: `api` and `ui` share one public domain, split by path
# at the edge router (Traefik under Coolify): `/ui/*` -> ui, everything
# else -> api (frontend design doc §3/§12, owner decision 2026-07-03: the
# UI ships as its own image, not bundled into the api image).
# Postgres and Redis are Coolify database resources on the internal network
# (not bundled here), so their lifecycle and backups stay managed by Coolify.
#
# Migration runs before the api starts. Single api instance today; when api
# replicas are scaled out (or on Kubernetes), move `alembic upgrade head`
# to a dedicated one-shot service / Job so replicas do not race the schema.

# Shared by worker and scheduler so a new required variable cannot be added
# to one and forgotten on the other.
x-worker-config: &worker-config
  build: server
  environment:
    CLAIRVOYANCE_DATABASE_URL: ${CLAIRVOYANCE_DATABASE_URL}
    CLAIRVOYANCE_REDIS_URL: ${CLAIRVOYANCE_REDIS_URL}
    CLAIRVOYANCE_RETENTION_DRY_RUN: ${CLAIRVOYANCE_RETENTION_DRY_RUN:-false}
  depends_on:
    api:
      condition: service_healthy

services:
  api:
    build: server
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000"
    environment:
      CLAIRVOYANCE_DATABASE_URL: ${CLAIRVOYANCE_DATABASE_URL}
      CLAIRVOYANCE_REDIS_URL: ${CLAIRVOYANCE_REDIS_URL}
      CLAIRVOYANCE_COLLECTOR_TOKEN_PEPPER: ${CLAIRVOYANCE_COLLECTOR_TOKEN_PEPPER}
      CLAIRVOYANCE_OIDC_ISSUER: ${CLAIRVOYANCE_OIDC_ISSUER}
      CLAIRVOYANCE_OIDC_AUDIENCE: ${CLAIRVOYANCE_OIDC_AUDIENCE}
      # Explicit by design: providers publish JWKS at different paths, so the
      # server never guesses it from the issuer (see app/auth/oidc.py).
      CLAIRVOYANCE_OIDC_JWKS_URL: ${CLAIRVOYANCE_OIDC_JWKS_URL}
      CLAIRVOYANCE_OIDC_ROLES_CLAIM: ${CLAIRVOYANCE_OIDC_ROLES_CLAIM:-roles}
      CLAIRVOYANCE_OIDC_ORG_CLAIM: ${CLAIRVOYANCE_OIDC_ORG_CLAIM:-org}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *worker-config
    command: celery -A app.worker.celery_app worker --loglevel=info

  scheduler:
    <<: *worker-config
    command: celery -A app.worker.celery_app beat --loglevel=info

  # Independent release artifact from api (frontend design doc §3, §11):
  # own image, own Dockerfile, no backend change. client_id is a ui-only
  # variable (the public OIDC client the SPA authenticates as); the
  # claim-name variables must be bound to the *same* Coolify shared
  # variable as the api service's own CLAIRVOYANCE_OIDC_ROLES_CLAIM /
  # CLAIRVOYANCE_OIDC_ORG_CLAIM above, or the two services can drift and
  # the SPA will shape navigation from claims the server does not verify
  # (design §12).
  ui:
    build: ui
    ports:
      - "8080"
    environment:
      CLAIRVOYANCE_OIDC_ISSUER: ${CLAIRVOYANCE_OIDC_ISSUER}
      CLAIRVOYANCE_OIDC_CLIENT_ID: ${CLAIRVOYANCE_OIDC_CLIENT_ID}
      CLAIRVOYANCE_OIDC_AUDIENCE: ${CLAIRVOYANCE_OIDC_AUDIENCE}
      CLAIRVOYANCE_OIDC_ROLES_CLAIM: ${CLAIRVOYANCE_OIDC_ROLES_CLAIM:-roles}
      CLAIRVOYANCE_OIDC_ORG_CLAIM: ${CLAIRVOYANCE_OIDC_ORG_CLAIM:-org}
      # Optional: only needed when the provider's discovery document is
      # absent or non-standard (design §6). Unset and omitted by default.
      CLAIRVOYANCE_OIDC_AUTHORIZE_URL: ${CLAIRVOYANCE_OIDC_AUTHORIZE_URL:-}
      CLAIRVOYANCE_OIDC_TOKEN_URL: ${CLAIRVOYANCE_OIDC_TOKEN_URL:-}
      CLAIRVOYANCE_OIDC_END_SESSION_URL: ${CLAIRVOYANCE_OIDC_END_SESSION_URL:-}
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/ui/
      interval: 30s
      timeout: 5s
      retries: 3
