# Local development stack with a REAL OIDC provider (Keycloak). Refs #77.
#
# This is NOT the production compose (docker-compose.coolify.yml, which
# assumes each organization's own IdP -- design section 5, provider-agnostic)
# and NOT the CI harness (ui/e2e/docker-compose.e2e.yml, which uses a stub
# issuer). It exists so a developer can exercise the full flow on their own
# machine: real sign-in, refresh-token rotation, and role-shaped screens.
#
# --- The issuer / JWKS split (read before changing ports or hostnames) ---
# The browser reaches Keycloak at http://localhost:8081 (its own host port),
# so every token Keycloak mints carries
#   iss = http://localhost:8081/realms/clairvoyance-dev
# The api never reaches that browser origin. It validates the iss string
# against CLAIRVOYANCE_OIDC_ISSUER and fetches signing keys from
# CLAIRVOYANCE_OIDC_JWKS_URL, which points at the INTERNAL compose name
#   http://keycloak:8080/realms/clairvoyance-dev/protocol/openid-connect/certs
# That split (browser-facing issuer + internal JWKS URL) is only possible
# because the JWKS URL is an explicit setting (app/auth/oidc.py never derives
# it from the issuer). KC_HOSTNAME below fixes Keycloak's issuer so the two
# never drift; start-dev keeps hostname-strict=false, so the api's JWKS fetch
# over the internal keycloak:8080 name still succeeds. Get this wrong and
# every admin request 401s.
#
# Keycloak runs on its own host origin (8081) rather than behind the proxy on
# purpose: in production the IdP is a separate origin from the app (design
# section 5), so this mirrors the real topology and keeps the proxy to the
# same /ui-vs-API split the deployment edge does.
#
# worker / scheduler are intentionally omitted: they run the collector
# retention jobs, which the admin UI does not exercise. Copy them from
# docker-compose.coolify.yml if you need to test retention locally.

name: clairvoyance-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clairvoyance
      POSTGRES_PASSWORD: clairvoyance
      POSTGRES_DB: clairvoyance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clairvoyance"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    command: ["start-dev", "--import-realm"]
    environment:
      # Dev-only bootstrap admin for the Keycloak console at
      # http://localhost:8081/admin/ (not needed for the app sign-in flow).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixes the browser-facing issuer and discovery endpoints (see header).
      # A full http URL is paired with KC_HTTP_ENABLED so start-dev serves it
      # over plain HTTP for local use.
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    # The realm is imported on first boot; --import-realm reads this path.
    volumes:
      - ./dev/realm.json:/opt/keycloak/data/import/realm.json:ro
    # Bound to loopback: this dev IdP ships hardcoded admin/admin bootstrap
    # credentials, so a default 0.0.0.0 publish would expose its admin console
    # to anyone on the host's network. Local-only, matching the README.
    ports:
      - "127.0.0.1:8081:8080"
    # No compose healthcheck: the Keycloak image ships without curl/wget/sh
    # utilities to script one reliably. Readiness is observed directly -- the
    # sign-in page at http://localhost:8081/realms/clairvoyance-dev/... serves
    # once import finishes. Nothing here blocks on Keycloak: the api resolves
    # JWKS lazily on the first token verification, not at startup.

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    environment:
      CLAIRVOYANCE_DATABASE_URL: postgresql+psycopg://clairvoyance:clairvoyance@postgres/clairvoyance
      CLAIRVOYANCE_REDIS_URL: redis://redis:6379/0
      # Dev-only fixed pepper so `app.cli create-token` works locally; never a
      # real secret. Rotating it invalidates any collector tokens minted with it.
      CLAIRVOYANCE_COLLECTOR_TOKEN_PEPPER: dev-pepper-not-for-real-use
      # Browser-facing issuer (matches the token iss); see header note.
      CLAIRVOYANCE_OIDC_ISSUER: http://localhost:8081/realms/clairvoyance-dev
      CLAIRVOYANCE_OIDC_AUDIENCE: clairvoyance-managed-dev
      # Internal compose-network path, NOT the browser origin; see header note.
      CLAIRVOYANCE_OIDC_JWKS_URL: http://keycloak:8080/realms/clairvoyance-dev/protocol/openid-connect/certs
      CLAIRVOYANCE_OIDC_ROLES_CLAIM: roles
      CLAIRVOYANCE_OIDC_ORG_CLAIM: org
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 20

  ui:
    build: ui
    environment:
      # Same browser-facing issuer as the api; the SPA discovers the
      # authorize/token/end-session endpoints from it (design section 6).
      CLAIRVOYANCE_OIDC_ISSUER: http://localhost:8081/realms/clairvoyance-dev
      CLAIRVOYANCE_OIDC_CLIENT_ID: clairvoyance-ui
      CLAIRVOYANCE_OIDC_AUDIENCE: clairvoyance-managed-dev
      CLAIRVOYANCE_OIDC_ROLES_CLAIM: roles
      CLAIRVOYANCE_OIDC_ORG_CLAIM: org
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/ui/"]
      interval: 10s
      timeout: 5s
      retries: 20

  proxy:
    image: nginx:1.27-alpine
    # Loopback-bound like keycloak above: the whole stack is local-only (the
    # realm's redirect URIs are hardcoded to localhost), so nothing here needs
    # to listen on the host's other interfaces.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dev/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
