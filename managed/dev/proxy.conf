# Development front proxy (Refs #77): the same /ui-vs-API path split the
# production edge (Traefik under Coolify) does, so the browser sees one origin
# for the app -- exactly as in production and in the e2e harness
# (ui/e2e/proxy/default.conf). Keycloak is deliberately NOT proxied here: it
# runs on its own host origin (http://localhost:8081), mirroring production
# where the IdP is a separate origin from the app (design section 5).
server {
    listen 80;
    server_name _;

    # `location /ui/` matches the /ui/ prefix but NOT the bare /ui a user
    # types; without this redirect that bare path falls through to the api
    # (location / below) and 404s. Send it to the trailing-slash form the SPA
    # is actually served under.
    location = /ui {
        return 308 /ui/;
    }

    location /ui/ {
        proxy_pass http://ui:8080/ui/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}
