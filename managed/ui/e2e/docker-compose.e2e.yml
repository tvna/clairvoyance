# Composed only for the managed-ui-e2e CI job (design doc §13): the ui
# image, the api image, Postgres, Redis, a front proxy doing the same
# /ui-vs-API path split the production edge does, and the purpose-built
# stub OIDC issuer (e2e/stub-issuer/). Not used for local dev or the real
# deployment (docker-compose.coolify.yml) -- this is CI-only harness code.
#
# All the "http://localhost:18080/..." values below must stay consistent:
# they are the one browser-facing origin the proxy exposes on the host,
# and they double as the `iss`/`aud` claims the stub issuer mints and the
# api verifies. The api's own JWKS fetch bypasses the proxy and reaches
# stub-issuer directly over the compose network -- that's the only value
# here that is not the shared http://localhost:18080 origin.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clairvoyance
      POSTGRES_PASSWORD: clairvoyance
      POSTGRES_DB: clairvoyance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clairvoyance"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  stub-issuer:
    build: stub-issuer
    environment:
      STUB_ISSUER_EXTERNAL_URL: http://localhost:18080/issuer
      STUB_ISSUER_PORT: "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../..
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    environment:
      CLAIRVOYANCE_DATABASE_URL: postgresql+psycopg://clairvoyance:clairvoyance@postgres/clairvoyance
      CLAIRVOYANCE_REDIS_URL: redis://redis:6379/0
      CLAIRVOYANCE_COLLECTOR_TOKEN_PEPPER: e2e-test-pepper-not-for-real-use
      CLAIRVOYANCE_OIDC_ISSUER: http://localhost:18080/issuer
      CLAIRVOYANCE_OIDC_AUDIENCE: clairvoyance-managed-e2e
      # Direct compose-network path, bypassing the proxy -- see header note.
      CLAIRVOYANCE_OIDC_JWKS_URL: http://stub-issuer:8000/jwks.json
      CLAIRVOYANCE_OIDC_ROLES_CLAIM: roles
      CLAIRVOYANCE_OIDC_ORG_CLAIM: org
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      stub-issuer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 5s
      timeout: 5s
      retries: 20

  ui:
    build: ..
    environment:
      CLAIRVOYANCE_OIDC_ISSUER: http://localhost:18080/issuer
      CLAIRVOYANCE_OIDC_CLIENT_ID: clairvoyance-ui-e2e
      CLAIRVOYANCE_OIDC_AUDIENCE: clairvoyance-managed-e2e
      CLAIRVOYANCE_OIDC_ROLES_CLAIM: roles
      CLAIRVOYANCE_OIDC_ORG_CLAIM: org
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/ui/"]
      interval: 5s
      timeout: 5s
      retries: 20

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
      stub-issuer:
        condition: service_healthy
