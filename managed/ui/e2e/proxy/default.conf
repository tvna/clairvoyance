# E2E-only front proxy (design §13): the same /ui-vs-API path split the
# production edge (Traefik under Coolify) does, plus /issuer for the stub
# OIDC issuer, so the browser sees exactly one origin -- as in production.
# Not used for local dev or the real deployment.
server {
    listen 80;
    server_name _;

    location /ui/ {
        proxy_pass http://ui:8080/ui/;
        proxy_set_header Host $host;
    }

    location /issuer/ {
        proxy_pass http://stub-issuer:8000/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}
