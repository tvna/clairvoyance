# The stub issuer is a standalone e2e fixture, deliberately kept off
# managed/pyproject.toml's dependency tree and pytest config (see app.py's
# module docstring). This local config anchors pytest's rootdir here so a
# plain `pytest` run does not walk up to managed/pyproject.toml and inherit
# its `--cov=app` addopts -- those target the managed FastAPI `app` package,
# not this stub's app.py, and would both fail collection and mis-resolve the
# import.
