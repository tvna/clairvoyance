# Alembic configuration. The database URL is not stored here: env.py reads
# CLAIRVOYANCE_DATABASE_URL so migrations run with the same runtime
# configuration as the app (Compose command today, Kubernetes Job later).
[alembic]
script_location = alembic
# The app is not installed as a package ([tool.uv] package = false); the
# alembic console script does not put the cwd on sys.path (python -m does),
# so without this the containerized `alembic upgrade head` cannot import
# app.config from env.py.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
