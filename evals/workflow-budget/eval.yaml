name: workflow-budget-eval
description: Quality suite for the Clairvoyance workflow budget elicitation skill.
skill: workflow-budget
version: "0.1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: workflow_budget_quality
    weight: 1.0
    threshold: 0.8
    description: Budget handoff includes an estimate, prepared choices, a recommendation, and the enforcement path.
tasks:
  - "tasks/*.yaml"
