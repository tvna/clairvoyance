name: CI

# Static validation that runs without any LLM/eval backend. Guards JSON
# manifests and hook script integrity including the cross-platform run-hook entry
# point. The version is owned by the git tag and written into plugin.json at
# release time (see docs/versioning.md), so there is no in-repo version drift to
# check here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Validate JSON files
        run: |
          set -euo pipefail
          files=(
            .claude-plugin/plugin.json
            .codex-plugin/plugin.json
            .claude-plugin/marketplace.json
            .agents/plugins/marketplace.json
            hooks/hooks.json
            hooks/codex-hooks.json
            .github/rulesets/main.json
          )
          for f in "${files[@]}"; do
            python3 -m json.tool "$f" > /dev/null
            echo "ok: $f"
          done

      - name: Validate release config
        run: node scripts/check_release_config.mjs

      - name: Check marketplace carries no version
        # The git tag / plugin.json own the version (see docs/versioning.md);
        # marketplace.json must carry none, or Claude Code silently prefers
        # plugin.json and masks a stale marketplace value. Drift gate for that
        # single-source-of-truth invariant.
        run: >
          python3 -c "import json,sys;
          d=json.load(open('.claude-plugin/marketplace.json'));
          bad=[p.get('name','?') for p in d['plugins'] if 'version' in p];
          sys.exit('marketplace.json must not carry a version: '+', '.join(bad)) if bad else print('ok: marketplace.json carries no version')"

      - name: Check Claude and Codex manifests carry the same version
        # apply_version.mjs writes the release version into both manifests; a
        # rename or a hand edit could drift them and ship a stale version to one
        # runtime. Guard the single-source-of-truth invariant across both.
        run: >
          python3 -c "import json,sys;
          c=json.load(open('.claude-plugin/plugin.json'))['version'];
          x=json.load(open('.codex-plugin/plugin.json'))['version'];
          sys.exit(f'manifest version drift: claude={c} codex={x}') if c!=x else print(f'ok: both manifests at {c}')"

      - name: Check ruleset required checks match CI jobs
        # Drift gate: every required_status_checks context in
        # .github/rulesets/main.json must name a real ci.yml job and vice versa,
        # so a renamed/added job cannot silently dangle a required check or leave
        # a job ungated. Stdlib-only, like the other validate-job checks.
        run: python3 scripts/check_ruleset_contexts.py

      - name: Check managed server version parity
        # The managed product carries its version in managed/server/pyproject.toml and in
        # the FastAPI app factory (managed/server/app/main.py). They must agree or the
        # server advertises a version that disagrees with its package. Managed-side
        # analogue of the plugin manifest-parity gate above (see docs/versioning.md).
        run: python3 scripts/check_managed_version.py

      - name: Check managed UI version parity
        # The UI release writes the same version to package.json and the root
        # package-lock entry; a hand edit to only one would make the UI release
        # artifact disagree with its lockfile.
        run: >
          node -e "const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('managed/ui/package.json','utf8')).version;
          const l=JSON.parse(fs.readFileSync('managed/ui/package-lock.json','utf8'));
          const root=l.version;
          const pkg=l.packages && l.packages[''] && l.packages[''].version;
          if (p!==root || p!==pkg) throw new Error('managed UI version drift: package='+p+' lock='+root+' lockRoot='+pkg);
          console.log('ok: managed UI version '+p+' matches package-lock');"

      - name: Check compose version marker
        # Compose releases have one explicit topology marker so topology-only
        # releases do not pretend to release the server or UI binaries.
        run: >
          node -e "const v=require('fs').readFileSync('managed/compose.version','utf8').trim();
          if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(v)) throw new Error('managed/compose.version is not semver: '+v);
          console.log('ok: compose version marker '+v);"

      - name: Validate hook scripts
        run: bash scripts/check_hooks.sh

      - name: Check skill best practices
        run: python3 scripts/check_skills.py

      - name: Publish skill best-practice summary
        # Always render the per-skill deterministic compliance table into the run's
        # job summary, so the latest pass/fail state is visible on every CI run
        # (including failures) without opening the step logs.
        if: always()
        run: python3 scripts/check_skills.py --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Check skill coverage (eval + doc, no orphans)
        run: python3 scripts/check_coverage.py

      - name: Check doc-cited test names exist (Refs #98)
        run: python3 scripts/check_doc_test_refs.py

      - name: Check no inline assert in shell-invoked python -c (Refs #121)
        run: python3 scripts/check_no_inline_assert.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Tokenless OIDC upload to Codecov (codecov-action use_oidc). The coverage
      # gate stays local (pytest --cov-fail-under in pyproject.toml); Codecov is
      # informational only, so a failed upload never blocks CI.
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true

      - name: Lint with ruff
        run: |
          uv run --frozen ruff check --output-format=github
          uv run --frozen ruff format --check

      - name: Type-check with mypy
        run: uv run --frozen mypy

      - name: Run script tests with coverage
        # pyproject's addopts already carry --cov and --cov-fail-under=100 (the
        # authoritative gate); add machine-readable reports for the Codecov
        # uploads below.
        run: uv run --frozen pytest --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          flags: scripts
          fail_ci_if_error: false
          use_oidc: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        with:
          files: ./junit.xml
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

  managed-server:
    # The managed coaching server (managed/server/) is a separate uv project with its
    # own lockfile and gates; its tests are SQLite-backed and need no services.
    # Root ruff already lints managed/ (per-directory config), but mypy and
    # pytest there only run through this job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: managed/server
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true

      - name: Lint with ruff
        run: |
          uv run --frozen ruff check --output-format=github
          uv run --frozen ruff format --check

      - name: Type-check with mypy
        run: uv run --frozen mypy

      - name: Run server tests with coverage
        # pyproject's addopts carry --cov and --cov-fail-under=100, same
        # authoritative-local-gate pattern as the root tests job.
        run: uv run --frozen pytest

  managed-ui:
    # The admin frontend (managed/ui/) is its own npm project (design doc
    # managed/docs/frontend-design.md §13). Like managed-server, this job
    # runs unconditionally on every PR: ci.yml has no per-job path gating,
    # so there is no filter mechanism to mirror for a UI-only change.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: managed/ui
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: managed/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and format with Biome
        run: npx biome ci .

      - name: Type-check with tsc
        run: npx tsc --noEmit

      - name: Run unit tests with Vitest
        run: npx vitest run

      - name: Build
        run: npm run build

  stub-issuer-unit:
    # Retro #64 repair 1: the e2e stub issuer's sign-in form must POST under
    # the /issuer proxy route; a root-absolute action bypassed it and timed
    # out both Playwright sign-ins. This standalone, no-Docker pytest guards
    # that with a plain in-process HTTP request. It is deliberately its own
    # job with no `needs` and no Docker, so it runs fast and independently --
    # a form-routing regression is caught even when the heavier managed-ui or
    # managed-ui-e2e jobs are red or skipped (that independence is the point:
    # the original bug slipped through precisely because the only check that
    # exercised the proxy path was the Docker-gated e2e). The stub is kept off
    # managed/server/pyproject.toml's dependency tree (see stub-issuer/app.py), so it
    # installs its own pinned requirements into a throwaway venv.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: managed/ui/e2e/stub-issuer
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Run stub issuer sign-in form unit test
        run: |
          python3 -m venv /tmp/stub-issuer-venv
          /tmp/stub-issuer-venv/bin/pip install --quiet -r requirements.txt -r requirements-test.txt
          /tmp/stub-issuer-venv/bin/python -m pytest test_signin_form.py -q

  managed-ui-e2e:
    # Playwright smoke against the real service path (design doc §13,
    # step 4): the ui image, the api image, Postgres, Redis, a front
    # proxy doing the /ui-vs-API path split, and the stub OIDC issuer
    # (managed/ui/e2e/stub-issuer/) composed together so the browser sees
    # one origin exactly as in production. This is unconditional like the
    # other managed-* jobs (no paths: gating).
    #
    # No `needs:` -- the job is self-contained (it checks out and builds
    # its own compose topology; it consumes no artifacts from managed-ui or
    # managed-server), so it starts in parallel with every other job instead
    # of waiting ~48s for those two to finish (issue #74). That moves the
    # slowest job off the critical-path tail. The trade-off is that a
    # lint/type failure elsewhere no longer skips the image build here; the
    # happy path dominates and `cancel-in-progress` bounds stacked runs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: managed/ui/package-lock.json

      - name: Install dependencies
        working-directory: managed/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: managed/ui
        run: npx playwright install --with-deps chromium

      - name: Build and start the e2e compose topology
        working-directory: managed/ui/e2e
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300

      - name: Seed the e2e organization
        # Admin API calls 403 with "unknown organization" until the org
        # a signed-in principal's claim points at actually exists
        # (app/deps.py get_admin_organization) -- the stub issuer mints
        # tokens for org "acme" (e2e/admin.spec.ts), so it must exist
        # before Playwright signs in.
        working-directory: managed/ui/e2e
        run: |
          docker compose -f docker-compose.e2e.yml exec -T api \
            python -m app.cli create-org --key acme --name "E2E Org"

      - name: Run Playwright smoke
        working-directory: managed/ui
        run: npx playwright test e2e/

      - name: Dump compose logs on failure
        if: failure()
        working-directory: managed/ui/e2e
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: managed/ui/playwright-report/
          retention-days: 7

      - name: Tear down compose topology
        if: always()
        working-directory: managed/ui/e2e
        run: docker compose -f docker-compose.e2e.yml down -v

  tests-windows:
    # The plugin's bundled scripts target Windows (run-hook.cmd locates Git Bash;
    # the store resolves %LOCALAPPDATA% and expects choco-installed sqlite3), but
    # the Linux jobs above never prove they run there. Exercise the store's bash
    # CLI on a real Windows runner via Git Bash. harden-runner is Linux-only, so
    # it is omitted here.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Compute monthly cache generation
        # `choco install sqlite` installs whatever the community feed currently
        # publishes (no version pin: see the review discussion on this PR for
        # why an unverified hardcoded version wasn't used instead). A constant
        # cache key would therefore let a cache hit silently pin CI to
        # whatever build happened to be current the first time the cache was
        # populated, forever, since actions/cache skips choco entirely on an
        # exact-key hit and choco itself never upgrades an installed package.
        # Folding the year-month into the key bounds that staleness to at most
        # one month and self-invalidates with no manual step to remember.
        id: cache-gen
        shell: pwsh
        run: echo "gen=$(Get-Date -UFormat '%Y-%m')" >> $env:GITHUB_OUTPUT

      - name: Cache Chocolatey sqlite package
        # `choco install sqlite` (a fresh package-feed resolve + download) is
        # consistently the single slowest step in this workflow. Cache the
        # installed package directory and skip the reinstall on a cache hit.
        id: cache-sqlite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\ProgramData\chocolatey\lib\sqlite
          key: windows-choco-sqlite-${{ steps.cache-gen.outputs.gen }}

      - name: Install sqlite3 CLI
        # Git for Windows ships no sqlite3, and a bare `choco install` can leave a
        # Store/stub `sqlite3` ahead of the real one on PATH (it prints a UTF-16
        # "…to install" notice and breaks the store). Install via choco unless
        # already restored from cache above.
        if: steps.cache-sqlite.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install sqlite -y --no-progress

      - name: Put sqlite3.exe on PATH
        # Runs unconditionally (cache hit or fresh install) since GITHUB_PATH
        # is not restored by the cache step, only the files are.
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'C:\ProgramData\chocolatey\lib\sqlite' -Recurse -Filter sqlite3.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'sqlite3.exe not found under C:\ProgramData\chocolatey\lib\sqlite' }
          Write-Host "sqlite3 at $($exe.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $exe.FullName)

      - name: Verify sqlite3 resolves to a real CLI
        shell: bash
        run: |
          which sqlite3
          sqlite3 -version

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true

      - name: Run store tests on Windows (bash scripts via Git Bash)
        # Confirms the bundled adaptive-store.sh runs under Windows Git Bash.
        # Also runs the persona long-run suite (#94): it shares the same
        # Git-Bash/sqlite3-CLI dependencies and was previously Windows-blind.
        # Coverage (--cov-fail-under=100) is enforced by the Linux job, so disable
        # it here — this run is about cross-platform execution, not coverage.
        run: uv run --frozen pytest tests/test_adaptive_store.py tests/test_adaptive_coaching_personas.py --no-cov
        shell: bash

  tests-macos-bash32:
    # Regression gate for issue #89 finding F5: bash 3.2 (Apple's stock,
    # GPLv2-frozen /bin/bash, still the default on GitHub's macOS runners)
    # mishandles `${var//pattern/replacement}` differently from bash 4/5 -- the
    # replacement's backslashes survive literally instead of being consumed,
    # which broke sql_text()'s quote-doubling and silently dropped observation
    # rows. The ubuntu/windows jobs above only ever exercise bash 4/5, so they
    # cannot catch this class of regression; pin CLAIRVOYANCE_TEST_BASH to the
    # real /bin/bash here instead of relying on PATH order (Homebrew bash, if
    # present, would otherwise shadow it). harden-runner is Linux-only, so it is
    # omitted here (see tests-windows).
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Verify /bin/bash is the stock bash 3.2
        # Fail loudly rather than silently passing on a runner image where
        # Apple has (hypothetically) changed the stock interpreter -- a quiet
        # pass here would defeat the whole point of the gate.
        run: |
          set -euo pipefail
          version="$(/bin/bash --version | head -1)"
          echo "${version}"
          case "${version}" in
            *"version 3.2"*) : ;;
            *) echo "::error::/bin/bash is not bash 3.2 on this runner (${version}); this job no longer exercises finding F5 -- update it" >&2; exit 1 ;;
          esac

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3  # v8.3.0
        with:
          enable-cache: true

      - name: Run store tests under bash 3.2
        # Coverage (--cov-fail-under=100) is enforced by the Linux job, so
        # disable it here -- this run is about the bash-version regression.
        env:
          CLAIRVOYANCE_TEST_BASH: /bin/bash
        run: uv run --frozen pytest tests/test_adaptive_store.py tests/test_adaptive_coaching_personas.py --no-cov
