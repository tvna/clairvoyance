name: Plugin Release

# Product-scoped release for the plugin bundle (tags: plugin-vX.Y.Z). Semantic
# versioning via semantic-release; the git tag is the single source of truth. The
# managed server releases independently (managed-vX.Y.Z); the full product-scoped
# release flow and required setup live in docs/versioning.md.
#
# Cadence is intentional, not per-merge: a weekly schedule cuts the release, and
# workflow_dispatch allows an ad-hoc release between weeks. Plain pushes to main
# never release.

on:
  schedule:
    # Mondays at 01:17 UTC (~10:17 JST). Off-minute by GitHub's own guidance.
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history + tags so semantic-release can find the last tag and the
          # commits since it. persist-credentials so @semantic-release/git can push
          # the release commit. A PAT/App token (RELEASE_TOKEN) is required to push
          # past the main ruleset and to trigger the required checks; it falls back
          # to GITHUB_TOKEN (release will fail to push to a protected main).
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Require a baseline tag
        # semantic-release recognizes prior releases only through tags matching
        # tagFormat (plugin-v-prefixed semver). A bare or unrelated tag would let a
        # naive "any tag" check pass yet still cut 1.0.0, so require a product-prefixed
        # semver tag (see docs/versioning.md); fail loudly rather than silently
        # releasing 1.0.0. Legacy bare vX.Y.Z tags are not baselines for this line.
        run: |
          if [ -z "$(git tag --list 'plugin-v[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "::error::No plugin-v semver tag found. Seed the plugin baseline first: git tag plugin-v0.3.0 && git push origin plugin-v0.3.0"
            exit 1
          fi

      - name: Cache npm packages for semantic-release
        # npx re-resolves and downloads the 8 packages (plus transitive deps)
        # from the registry on every run since there is no lockfile to key a
        # setup-node cache off of (see the "Run semantic-release" step comment
        # for why no node manifest is committed). Caching npm's own tarball
        # cache directory (~/.npm) cuts that repeat download on unchanged
        # runs; the key is scoped to this file so a version bump in the npx
        # command below naturally invalidates it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-semantic-release-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            npm-semantic-release-

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        # Versions pinned by major. semantic-release runs on the runner's
        # preinstalled Node; no node manifest is committed to this Python repo.
        run: >
          npx --yes
          -p semantic-release@^24
          -p @semantic-release/commit-analyzer@^13
          -p @semantic-release/release-notes-generator@^14
          -p @semantic-release/changelog@^6
          -p @semantic-release/exec@^7
          -p @semantic-release/git@^10
          -p @semantic-release/github@^11
          -p conventional-changelog-conventionalcommits@^8
          semantic-release
