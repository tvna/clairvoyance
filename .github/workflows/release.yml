name: Release

# Semantic versioning via semantic-release; the git tag is the single source of
# truth. The full release flow and required setup live in docs/versioning.md.
#
# Cadence is intentional, not per-merge: a weekly schedule cuts the release, and
# workflow_dispatch allows an ad-hoc release between weeks. Plain pushes to main
# never release.

on:
  schedule:
    # Mondays at 01:17 UTC (~10:17 JST). Off-minute by GitHub's own guidance.
    - cron: "17 1 * * 1"
  workflow_dispatch:
    inputs:
      product:
        description: Product release line to run.
        type: choice
        required: true
        default: all
        options:
          - all
          - plugin
          - server
          - ui
          - compose

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.product || 'scheduled' }}
  cancel-in-progress: false

jobs:
  release:
    name: release-${{ matrix.product }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        product: [plugin, server, ui, compose]
    steps:
      - name: Check selected product
        id: selection
        run: |
          requested="${{ github.event.inputs.product || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.product }}" ]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Harden runner
        if: steps.selection.outputs.selected == 'true'
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        if: steps.selection.outputs.selected == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history + tags so semantic-release can find the last tag and the
          # commits since it. persist-credentials so @semantic-release/git can push
          # the release commit. A PAT/App token (RELEASE_TOKEN) is required to push
          # past the main ruleset and to trigger the required checks; it falls back
          # to GITHUB_TOKEN (release will fail to push to a protected main).
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check baseline tag
        if: steps.selection.outputs.selected == 'true'
        id: baseline
        # semantic-release recognizes prior releases only through tags matching
        # tagFormat. A bare or unrelated tag would let a naive "any tag" check
        # pass yet still cut 1.0.0, so require a product-prefixed semver tag (see
        # docs/versioning.md). Missing baselines skip the product release rather
        # than letting semantic-release silently cut 1.0.0.
        run: |
          product="${{ matrix.product }}"
          if [ "$product" = "plugin" ]; then
            baseline="plugin-v0.5.0"
          else
            baseline="${product}-v0.1.0"
          fi
          if ! git tag --list "${product}-v*" | grep -E -q "^${product}-v[0-9]+\\.[0-9]+\\.[0-9]+$"; then
            echo "::notice::No ${product}-prefixed semver baseline tag found. Seed it first: git tag ${baseline} && git push origin ${baseline}"
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache npm packages for semantic-release
        if: steps.baseline.outputs.has_baseline == 'true'
        # npx re-resolves and downloads the 8 packages (plus transitive deps)
        # from the registry on every run since there is no lockfile to key a
        # setup-node cache off of (see the "Run semantic-release" step comment
        # for why no node manifest is committed). Caching npm's own tarball
        # cache directory (~/.npm) cuts that repeat download on unchanged
        # runs; the key is scoped to this file so a version bump in the npx
        # command below naturally invalidates it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-semantic-release-${{ hashFiles('.github/workflows/release.yml', 'release.config.cjs') }}
          restore-keys: |
            npm-semantic-release-

      - name: Run semantic-release
        if: steps.baseline.outputs.has_baseline == 'true'
        env:
          CLAIRVOYANCE_RELEASE_PRODUCT: ${{ matrix.product }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        # Versions pinned by major. semantic-release runs on the runner's
        # preinstalled Node; no node manifest is committed to this Python repo.
        run: >
          npx --yes
          -p semantic-release@^24
          -p @semantic-release/commit-analyzer@^13
          -p @semantic-release/release-notes-generator@^14
          -p @semantic-release/changelog@^6
          -p @semantic-release/exec@^7
          -p @semantic-release/git@^10
          -p @semantic-release/github@^11
          -p conventional-changelog-conventionalcommits@^8
          semantic-release
